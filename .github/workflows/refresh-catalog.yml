name: Refresh catalog

# Triggered on demand — from the Refresh button in the app, or from the
# Actions tab. There is deliberately no schedule.
on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Film year to rebuild'
        required: true
        type: string
      mode:
        description: 'full = scrape the sources and enrich; enrich = only fill in existing entries'
        required: true
        type: choice
        default: full
        options:
          - full
          - enrich
      only:
        description: 'Catalog ids to resolve, comma separated — skips the scrape entirely'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Report only, do not commit'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Check the TMDB credential
        env:
          TMDB_API: ${{ secrets.TMDB_API }}
        run: node scripts/check-tmdb-secret.mjs

      # enrich fills release dates and cast from TMDB for the catalog we
      # already have; full also re-scrapes the schedule and streaming lists.
      # year and only are free text, so they go in through the environment
      # rather than being pasted into the script: an expression expanded inline
      # is expanded before any shell quoting can apply to it.
      - name: Refresh catalog
        env:
          TMDB_API: ${{ secrets.TMDB_API }}
          YEAR: ${{ inputs.year }}
          ONLY: ${{ inputs.only }}
        run: |
          node scripts/refresh-catalog.mjs \
            --year "$YEAR" \
            ${ONLY:+--only "$ONLY"} \
            ${{ inputs.mode == 'enrich' && '--enrich-only' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit changes
        if: ${{ !inputs.dry_run }}
        env:
          YEAR: ${{ inputs.year }}
          ONLY: ${{ inputs.only }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The script writes the catalog and its browse index. Staging only
          # one leaves the other unstaged, which makes the rebase below refuse.
          if git diff --quiet -- data/catalog data/browse; then
            echo "Catalog unchanged."
            exit 0
          fi
          git add data/catalog data/browse
          if [ -n "$ONLY" ]; then
            git commit -m "Resolve $ONLY"
          else
            git commit -m "Refresh $YEAR catalog"
          fi

          # Anything still uncommitted would break the rebase, so say which.
          if ! git diff --quiet; then
            echo "Unstaged changes remain after committing:" >&2
            git status --porcelain >&2
            exit 1
          fi
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((2 ** i))
          done
          echo "Could not push after 4 attempts" >&2
          exit 1
